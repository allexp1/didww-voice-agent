# Voice/RTP tuning for didww-voice-agent (sysctl drop-in: /etc/sysctl.d/).
# Defaults on Ubuntu 24.04 are too small for real-time RTP under burst:
# 208 KiB rmem/wmem and 1000-deep NIC backlog will drop packets when the
# Node event loop pauses (GC, scheduler hiccup) for >~50 ms.

# UDP socket buffers — default 208 KiB → 8 MiB default, 32 MiB max.
net.core.rmem_default = 8388608
net.core.rmem_max     = 33554432
net.core.wmem_default = 8388608
net.core.wmem_max     = 33554432

# NIC ingress queue depth — default 1000 → 8192.
net.core.netdev_max_backlog = 8192

# UDP global memory pressure thresholds (in 4 KiB pages).
net.ipv4.udp_mem       = 8388608 12582912 16777216
net.ipv4.udp_rmem_min  = 16384
net.ipv4.udp_wmem_min  = 16384
